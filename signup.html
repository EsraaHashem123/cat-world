
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Cat World</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="register-page">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg cat-navbar fixed-top">
        <div class="container">

            <a class="navbar-brand cat-brand" href="index.html">
                <span class="brand-icon">🐱</span>
                <span>Cat World</span>
            </a>

            <button
                class="navbar-toggler cat-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
                aria-controls="navbarContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">

                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="breeds.html">Cat Breeds</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="pricing.html">Pricing</a>
                    </li>
                </ul>

                <div class="navbar-actions">
                    <a href="login.html" class="btn login-btn">Login</a>

                    <a href="signup.html" class="btn register-btn active">
                        Register
                    </a>

                    <a href="cart.html" class="btn cart-btn">
                        🛒 Cart
                        <span id="cart-count" class="cart-count">0</span>
                    </a>
                </div>

            </div>
        </div>
    </nav>

    <!-- Register Section -->
    <main class="register-section">

        <div class="register-card">

            <div class="register-icon">🐾</div>

            <h1>Create Account</h1>

            <p class="register-subtitle">
                Join our Cat World family!
            </p>

            <form id="register-form">

                <div class="mb-3 text-start">
                    <label for="register-name" class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="register-name"
                        placeholder="Enter your full name"
                        minlength="2"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="mb-3 text-start">
                    <label for="register-email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="register-email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="mb-3 text-start">
                    <label for="register-password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="register-password"
                        placeholder="Create a password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <small class="password-hint">
                        Use at least 8 characters.
                    </small>
                </div>

                <div class="mb-3 text-start">
                    <label for="confirm-password" class="form-label">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirm-password"
                        placeholder="Re-enter your password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="register-terms">
                    <input type="checkbox" id="accept-terms" required>

                    <label for="accept-terms">
                        I agree to the Terms and Conditions.
                    </label>
                </div>

                <button type="submit" class="register-submit-btn">
                    Create Account
                </button>

                <p id="register-message" class="register-message"></p>

            </form>

            <div class="register-footer">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

            <a href="index.html" class="register-back-home">
                ← Back to Home
            </a>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
